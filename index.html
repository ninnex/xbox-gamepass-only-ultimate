<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse games included in Xbox Game Pass Ultimate but not in Premium."
    />
    <title>Game Pass Ultimate</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WMQVJ361WQ"></script>
    <script>

      gtag('config', 'G-WMQVJ361WQ');

    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme');
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'dark';
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8f7;
        --surface: #ffffff;
        --surface-soft: #f3f5f3;
        --ink: #171a18;
        --muted: #747b76;
        --faint: #9ba29d;
        --line: #e4e8e4;
        --green: #107c10;
        --green-dark: #075f09;
        --green-soft: #e8f4e8;
        --blue: #3666d6;
        --blue-soft: #eaf0ff;
        --violet: #7456d8;
        --violet-soft: #f0edff;
        --amber: #9a5b00;
        --amber-soft: #fff3d8;
        --rose: #a33870;
        --rose-soft: #fcebf4;
        --red: #b42318;
        --red-soft: #fef3f2;
        --shadow: 0 1px 2px rgba(20, 28, 22, 0.04), 0 12px 32px rgba(20, 28, 22, 0.05);
        --radius: 16px;
        --control-line: #dde1dd;
        --row-line: #edf0ed;
        --row-hover: #fafbfa;
        --text-strong: #222623;
        --text-body: #262a27;
        --view-active: #f0f2f0;
        --spinner-track: #dfe6df;
        --control-text: #5f6761;
        --search-icon: #848c85;
        --summary-text: #7d847f;
        --tab-text: #737a75;
        --icon-text: #7b837d;
        --rank-text: #7e867f;
        --note-text: #929992;
        --footer-text: #888f89;
        --check: #308551;
        --dash: #c2c7c3;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d100e;
        --surface: #161a17;
        --surface-soft: #202521;
        --ink: #f3f6f3;
        --muted: #a2aaa4;
        --faint: #7f8881;
        --line: #2b312c;
        --green: #6fd06f;
        --green-dark: #8adb8a;
        --green-soft: #18371b;
        --blue: #8eacff;
        --blue-soft: #1b294c;
        --violet: #b7a5ff;
        --violet-soft: #2d254c;
        --amber: #ffc66d;
        --amber-soft: #493208;
        --rose: #f3acd1;
        --rose-soft: #482039;
        --red: #ff968d;
        --red-soft: #431f1c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.22), 0 14px 34px rgba(0, 0, 0, 0.28);
        --control-line: #353c36;
        --row-line: #282e29;
        --row-hover: #1b201c;
        --text-strong: #f3f6f3;
        --text-body: #dfe4df;
        --view-active: #252b26;
        --spinner-track: #343b35;
        --control-text: #b3bbb5;
        --search-icon: #929b94;
        --summary-text: #9da59f;
        --tab-text: #a7afa9;
        --icon-text: #a7afa9;
        --rank-text: #939c95;
        --note-text: #909991;
        --footer-text: #969f98;
        --check: #76c992;
        --dash: #566058;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select {
        cursor: pointer;
      }

      .app {
        width: min(1540px, calc(100% - 44px));
        margin: 0 auto;
        padding: 34px 0 20px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 0 2px 25px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: flex-start;
        gap: 14px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 13px;
        color: white;
        background: linear-gradient(145deg, #20a11e, #08720b);
        box-shadow: 0 8px 20px rgba(16, 124, 16, 0.22);
      }

      .brand-mark img {
        width: 30px;
        height: 30px;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 2.3vw, 34px);
        line-height: 1.12;
        letter-spacing: -0.035em;
      }

      .title-line {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
      }

      .author-credit {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border: 2px solid var(--bg);
        border-radius: 50%;
        background: #d09a20;
        box-shadow: 0 0 0 3px #f4e8c6;
      }

      .status.ready .status-dot {
        background: #36a263;
        box-shadow: 0 0 0 3px #d8eee0;
      }

      .status.error .status-dot {
        background: var(--red);
        box-shadow: 0 0 0 3px #fee4e2;
      }

      .header-actions {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 16px;
      }

      .theme-toggle {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--control-line);
        border-radius: 13px;
        background: var(--surface);
        color: var(--icon-text);
        box-shadow: 0 1px 1px rgba(16, 30, 18, 0.02);
      }

      .theme-toggle:hover {
        color: var(--ink);
        background: var(--surface-soft);
      }

      .theme-toggle svg {
        width: 20px;
        height: 20px;
      }

      .theme-icon-sun {
        display: none;
      }

      html[data-theme="dark"] .theme-icon-moon {
        display: none;
      }

      html[data-theme="dark"] .theme-icon-sun {
        display: block;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 22px;
        padding: 20px 0 16px;
      }

      .filters,
      .quick-tabs,
      .view-switch {
        display: flex;
        align-items: center;
      }

      .filters {
        flex: 1 1 auto;
        gap: 10px;
        min-width: 0;
      }

      .quick-tabs {
        gap: 4px;
      }

      .control,
      .search-box {
        height: 48px;
        border: 1px solid var(--control-line);
        border-radius: 14px;
        background: var(--surface);
        color: var(--control-text);
        box-shadow: 0 1px 1px rgba(16, 30, 18, 0.02);
      }

      .control {
        min-width: 174px;
        padding: 0 39px 0 15px;
        font-weight: 650;
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, #777f79 50%),
          linear-gradient(135deg, #777f79 50%, transparent 50%);
        background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }

      .search-box {
        position: relative;
        width: min(360px, 36vw);
        min-width: 230px;
      }

      .search-box svg {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 20px;
        height: 20px;
        color: var(--search-icon);
        transform: translateY(-50%);
        pointer-events: none;
      }

      .search-box input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        padding: 0 16px 0 45px;
        background: transparent;
        color: var(--ink);
      }

      .search-box:focus-within,
      .control:focus-visible,
      .icon-button:focus-visible,
      .theme-toggle:focus-visible,
      .tab:focus-visible,
      .retry-button:focus-visible {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(16, 124, 16, 0.12);
        outline: 0;
      }

      .right-tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .summary-label {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding-right: 15px;
        border-right: 1px solid var(--line);
        color: var(--summary-text);
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .summary-label strong {
        color: var(--ink);
        font-size: 14px;
        letter-spacing: 0;
      }

      .tab {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: transparent;
        color: var(--tab-text);
        font-size: 14px;
        font-weight: 650;
        white-space: nowrap;
      }

      .tab:hover {
        color: var(--ink);
        background: var(--surface-soft);
      }

      .tab.active {
        color: var(--green);
        background: var(--green-soft);
      }

      .tab-count {
        display: inline-block;
        min-width: 1.3em;
        margin-left: 4px;
        color: inherit;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        opacity: 0.78;
      }

      .view-switch {
        overflow: hidden;
        flex: 0 0 auto;
        border: 1px solid var(--control-line);
        border-radius: 12px;
        background: var(--surface);
      }

      .icon-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 0;
        border-right: 1px solid var(--line);
        background: transparent;
        color: var(--icon-text);
      }

      .icon-button:last-child {
        border-right: 0;
      }

      .icon-button.active {
        color: var(--ink);
        background: var(--view-active);
      }

      .icon-button svg {
        width: 20px;
        height: 20px;
      }

      .data-panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 850px;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th {
        height: 50px;
        padding: 0 16px;
        color: var(--faint);
        font-size: 12px;
        font-weight: 700;
        text-align: left;
        white-space: nowrap;
      }

      .col-rank {
        width: 70px;
        text-align: center;
      }

      .col-game {
        width: auto;
      }

      .col-classification {
        width: 190px;
      }

      .col-platform {
        width: 120px;
        text-align: center;
      }

      td {
        height: 68px;
        padding: 0 16px;
        border-top: 1px solid var(--row-line);
        color: var(--text-body);
        font-size: 14px;
        white-space: nowrap;
      }

      td.center {
        text-align: center;
      }

      tbody tr {
        transition: background 0.16s ease;
      }

      tbody tr:hover {
        background: var(--row-hover);
      }

      .rank-cell {
        color: var(--rank-text);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .game {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 12px;
      }

      .game-art {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        overflow: hidden;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        text-decoration: none;
      }

      .art-0 { background: linear-gradient(145deg, #36584d, #101b18); }
      .art-1 { background: linear-gradient(145deg, #c64f35, #532018); }
      .art-2 { background: linear-gradient(145deg, #267899, #102d40); }
      .art-3 { background: linear-gradient(145deg, #7957a8, #2d1d48); }
      .art-4 { background: linear-gradient(145deg, #d19f2c, #5b4011); }
      .art-5 { background: linear-gradient(145deg, #398643, #14331a); }
      .art-6 { background: linear-gradient(145deg, #687588, #232a34); }
      .art-7 { background: linear-gradient(145deg, #b64155, #4d1721); }
      .art-8 { background: linear-gradient(145deg, #3595bc, #143a5e); }
      .art-9 { background: linear-gradient(145deg, #745be2, #2f246a); }

      .game-copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .game-title-row {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
      }

      .game-name {
        display: block;
        overflow: hidden;
        color: var(--text-strong);
        cursor: pointer;
        font-size: 15px;
        font-weight: 720;
        text-decoration: none;
        text-overflow: ellipsis;
      }

      .game-name:hover {
        color: var(--text-strong);
        text-decoration: none;
      }

      .game-note {
        margin-top: 3px;
        color: var(--note-text);
        font-size: 12px;
      }

      .badge.mobile-category {
        display: none;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 750;
      }

      .badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .badge-exclusive {
        color: var(--green-dark);
        background: var(--green-soft);
      }

      .badge-ea {
        color: var(--blue);
        background: var(--blue-soft);
      }

      .badge-ubisoft {
        color: var(--rose);
        background: var(--rose-soft);
      }

      .badge-essential {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .badge-premium {
        color: var(--violet);
        background: var(--violet-soft);
      }

      .new-game-badge {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 4px 7px;
        color: #7a3d00;
        background: #fff0c2;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      [data-theme="dark"] .new-game-badge {
        color: #ffd38a;
        background: #4d3108;
      }

      .check,
      .dash {
        font-size: 15px;
        font-weight: 800;
      }

      .check {
        color: var(--check);
      }

      .dash {
        color: var(--dash);
      }

      .panel-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 55px;
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        color: var(--footer-text);
        font-size: 12px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 15px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .catalog-updated {
        margin: 0;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        color: var(--footer-text);
        font-size: 12px;
        text-align: right;
      }

      .mobile-generated-date {
        display: none;
      }

      .message {
        display: grid;
        min-height: 320px;
        place-items: center;
        padding: 64px 20px;
        color: var(--muted);
        text-align: center;
      }

      .message strong {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
        font-size: 16px;
      }

      .message.error strong {
        color: var(--red);
      }

      .spinner {
        width: 30px;
        height: 30px;
        margin: 0 auto 16px;
        border: 3px solid var(--spinner-track);
        border-top-color: var(--green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .retry-button {
        margin-top: 18px;
        border: 1px solid var(--green);
        border-radius: 10px;
        padding: 9px 14px;
        color: white;
        background: var(--green);
        font-weight: 700;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
        padding: 16px;
      }

      .game-card {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        background: var(--surface);
      }

      .game-card .game {
        margin-bottom: 17px;
      }

      .card-details {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .platforms {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 1540px) {
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .right-tools {
          width: 100%;
          justify-content: space-between;
        }

        .quick-tabs {
          overflow-x: auto;
        }
      }

      @media (max-width: 760px) {
        .app {
          width: min(100% - 24px, 1540px);
          padding-top: 20px;
        }

        .topbar {
          align-items: flex-start;
          gap: 12px;
        }

        .brand,
        .brand > div:last-child {
          min-width: 0;
        }

        .header-actions {
          gap: 0;
        }

        .theme-toggle {
          width: 40px;
          height: 40px;
          border-radius: 12px;
        }

        .brand-mark {
          width: 40px;
          height: 40px;
          border-radius: 12px;
        }

        .subtitle {
          font-size: 14px;
          line-height: 1.45;
        }

        .status {
          display: none;
        }

        .filters {
          width: 100%;
          flex-wrap: wrap;
        }

        .control {
          flex: 1 1 145px;
          min-width: 140px;
        }

        .search-box {
          order: -1;
          width: 100%;
          min-width: 0;
        }

        .right-tools {
          align-items: flex-start;
          gap: 9px;
        }

        .summary-label {
          display: none;
        }

        .quick-tabs {
          padding-bottom: 3px;
        }

        .tab {
          padding: 9px 10px;
        }

        .panel-footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 600px) {
        .data-panel[data-view="list"] > .catalog-updated {
          display: none;
        }

        .table-wrap {
          overflow-x: hidden;
        }

        table {
          min-width: 0;
          table-layout: fixed;
        }

        .col-classification,
        .col-platform {
          display: none;
        }

        th {
          height: 46px;
        }

        .col-rank {
          width: 44px;
          padding: 0 6px;
        }

        .col-game {
          width: auto;
          padding: 0 12px 0 4px;
        }

        .game-heading {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }

        .mobile-generated-date {
          display: inline-block;
          overflow: hidden;
          color: var(--footer-text);
          font-size: 10px;
          font-weight: 500;
          letter-spacing: 0;
          text-align: right;
          text-overflow: ellipsis;
          text-transform: none;
          white-space: nowrap;
        }

        td {
          height: 76px;
        }

        td.col-game {
          padding-top: 7px;
          padding-bottom: 7px;
          white-space: normal;
        }

        .game {
          gap: 10px;
        }

        .game-art {
          width: 44px;
          height: 44px;
        }

        .game-copy {
          overflow: hidden;
          flex: 1 1 auto;
        }

        .game-meta {
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
          min-width: 0;
          gap: 10px;
          margin-top: 2px;
        }

        .game-name {
          display: -webkit-box;
          overflow: hidden;
          font-size: 14px;
          line-height: 1.25;
          white-space: normal;
          text-overflow: clip;
          -webkit-box-orient: vertical;
          -webkit-line-clamp: 2;
        }

        .game-note {
          overflow: hidden;
          flex: 0 1 auto;
          margin-top: 0;
          font-size: 11px;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .data-panel[data-view="list"] .badge.mobile-category {
          display: inline-flex;
          flex: 0 0 auto;
          margin-left: auto;
          border: 1px solid transparent;
          padding: 4px 7px;
          font-size: 9px;
          line-height: 1;
        }

        .data-panel[data-view="list"] .badge.mobile-category::before {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Xbox_app_logo.svg"
              alt="Xbox"
            />
          </div>
          <div>
            <div class="title-line">
              <h1>Game Pass Ultimate</h1>
              <span class="author-credit">by ninnex</span>
            </div>
            <p class="subtitle">Games exclusive to Ultimate, excluding Premium.</p>
          </div>
        </div>
        <div class="header-actions">
          <div id="status" class="status" role="status">
            <span class="status-dot"></span>
            <span id="statusText">LOADING CATALOG</span>
          </div>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
            </svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="toolbar" aria-label="Catalog controls">
        <div class="filters">
          <select id="resultSet" class="control" aria-label="Result set">
            <option value="difference">Ultimate not Premium</option>
            <option value="exclusive">Ultimate Exclusive</option>
            <option value="ultimate">Ultimate</option>
            <option value="premium">Premium</option>
            <option value="essential">Essential</option>
          </select>
          <label class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="Search games" autocomplete="off" />
          </label>
          <select id="platformFilter" class="control" aria-label="Platform filter">
            <option value="all">All platforms</option>
            <option value="pc">PC</option>
            <option value="console">Console</option>
          </select>
        </div>

        <div class="right-tools">
          <div class="summary-label"><strong id="resultCount">0</strong> results</div>
          <div class="quick-tabs" role="tablist" aria-label="Classification"></div>
          <div class="view-switch" aria-label="View options">
            <button class="icon-button" data-view="grid" aria-label="Grid view" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
              </svg>
            </button>
            <button class="icon-button active" data-view="list" aria-label="List view" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 6h12M9 12h12M9 18h12"></path>
                <circle cx="4" cy="6" r="1"></circle>
                <circle cx="4" cy="12" r="1"></circle>
                <circle cx="4" cy="18" r="1"></circle>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="data-panel" aria-label="Game catalog">
        <p id="generated-date" class="catalog-updated" hidden></p>
        <div id="content">
          <div class="message">
            <div>
              <div class="spinner" aria-hidden="true"></div>
              <strong>Loading the catalog…</strong>
              Reading the processed Game Pass data.
            </div>
          </div>
        </div>
        <footer class="panel-footer">
          <div class="legend" aria-label="Classification legend"></div>
          <span>United States catalog · PC and Console</span>
        </footer>
      </section>
    </main>

    <script>
      'use strict';

      const DATASETS = {
        difference: 'data/ultimate-no-premium.csv',
        exclusive: 'data/ultimate-exclusive.csv',
        ultimate: 'data/ultimate.csv',
        premium: 'data/premium.csv',
        essential: 'data/essential.csv',
        eaPlay: 'data/ea-play.csv',
        ubisoftPlus: 'data/ubisoft-plus.csv'
      };
      const DATASET_LABELS = {
        difference: 'Ultimate not Premium',
        exclusive: 'Ultimate Exclusive',
        ultimate: 'Ultimate',
        premium: 'Premium',
        essential: 'Essential'
      };
      const SOURCE_HEADERS = ['name', 'productId', 'console', 'pc', 'storePath', 'newSinceDate'];
      const PROCESSED_HEADERS = [
        'name',
        'productId',
        'console',
        'pc',
        'category',
        'storePath',
        'newSinceDate'
      ];
      const CATEGORY_CONFIG = {
        Essential: {
          shortLabel: 'Essential',
          badgeClass: 'badge-essential',
          color: '#c47a08'
        },
        Premium: {
          shortLabel: 'Premium',
          badgeClass: 'badge-premium',
          color: '#bd4f89'
        },
        'EA Play': {
          shortLabel: 'EA Play',
          badgeClass: 'badge-ea',
          color: '#3666d6'
        },
        'Ubisoft+ Classics': {
          shortLabel: 'Ubisoft+',
          badgeClass: 'badge-ubisoft',
          color: '#7456d8'
        },
        'Ultimate Exclusive': {
          shortLabel: 'Exclusive',
          badgeClass: 'badge-exclusive',
          color: '#107c10'
        }
      };
      const CATEGORY_ORDER = Object.keys(CATEGORY_CONFIG);
      const ALLOWED_CATEGORIES = new Set(CATEGORY_ORDER);
      const state = {
        datasets: {
          difference: [],
          exclusive: [],
          ultimate: [],
          premium: [],
          essential: [],
          eaPlay: [],
          ubisoftPlus: []
        },
        catalogInfo: null,
        dataset: 'difference',
        search: '',
        category: 'all',
        platform: 'all',
        view: 'list',
        loaded: false
      };

      const content = document.querySelector('#content');
      const resultCount = document.querySelector('#resultCount');
      const status = document.querySelector('#status');
      const statusText = document.querySelector('#statusText');
      const dataPanel = document.querySelector('.data-panel');
      const quickTabs = document.querySelector('.quick-tabs');
      const legend = document.querySelector('.legend');
      const generatedDate = document.querySelector('#generated-date');

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let field = '';
        let quoted = false;
        const source = text.replace(/^\uFEFF/, '');

        for (let index = 0; index < source.length; index += 1) {
          const character = source[index];

          if (quoted) {
            if (character === '"' && source[index + 1] === '"') {
              field += '"';
              index += 1;
            } else if (character === '"') {
              quoted = false;
            } else {
              field += character;
            }
          } else if (character === '"') {
            quoted = true;
          } else if (character === ',') {
            row.push(field);
            field = '';
          } else if (character === '\n') {
            row.push(field.replace(/\r$/, ''));
            if (row.some(function (value) { return value !== ''; })) {
              rows.push(row);
            }
            row = [];
            field = '';
          } else {
            field += character;
          }
        }

        if (quoted) {
          throw new Error('CSV contains an unterminated quoted value.');
        }

        if (field !== '' || row.length > 0) {
          row.push(field.replace(/\r$/, ''));
          rows.push(row);
        }

        return rows;
      }

      function parseBoolean(value, rowNumber, column) {
        if (value === 'true') return true;
        if (value === 'false') return false;
        throw new Error('Invalid ' + column + ' value on CSV row ' + rowNumber + '.');
      }

      function parseCatalog(text) {
        const rows = parseCsv(text);
        if (rows.length < 2) {
          throw new Error('The catalog is empty.');
        }

        const headers = rows[0];
        const hasCategory = headers.length === PROCESSED_HEADERS.length;
        const expectedHeaders = hasCategory ? PROCESSED_HEADERS : SOURCE_HEADERS;
        if (
          headers.length !== expectedHeaders.length ||
          headers.some(function (header, index) { return header !== expectedHeaders[index]; })
        ) {
          throw new Error('The catalog has an unexpected header.');
        }

        return rows.slice(1).map(function (row, index) {
          const rowNumber = index + 2;
          if (row.length !== expectedHeaders.length || !row[0]) {
            throw new Error('Invalid CSV row ' + rowNumber + '.');
          }
          const categoryIndex = hasCategory ? 4 : -1;
          const storePathIndex = hasCategory ? 5 : 4;
          const newSinceDateIndex = hasCategory ? 6 : 5;
          if (!/^[A-Z0-9]{12}$/.test(row[1])) {
            throw new Error('Invalid Product ID on CSV row ' + rowNumber + '.');
          }
          if (hasCategory && !ALLOWED_CATEGORIES.has(row[categoryIndex])) {
            throw new Error('Invalid category on CSV row ' + rowNumber + '.');
          }
          if (
            !row[storePathIndex] ||
            row[storePathIndex].startsWith('/') ||
            row[storePathIndex].includes('://') ||
            row[storePathIndex].includes('?') ||
            row[storePathIndex].includes('#') ||
            row[storePathIndex].includes('..') ||
            row[storePathIndex].split('/').at(-1) !== row[1]
          ) {
            throw new Error('Invalid storePath on CSV row ' + rowNumber + '.');
          }
          if (
            row[newSinceDateIndex] &&
            !isCanonicalIsoDate(row[newSinceDateIndex])
          ) {
            throw new Error('Invalid newSinceDate on CSV row ' + rowNumber + '.');
          }
          return {
            name: row[0],
            productId: row[1],
            console: parseBoolean(row[2], rowNumber, 'console'),
            pc: parseBoolean(row[3], rowNumber, 'pc'),
            category: hasCategory ? row[categoryIndex] : null,
            storePath: row[storePathIndex],
            newSinceDate: row[newSinceDateIndex]
          };
        });
      }

      function isCanonicalIsoDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const date = new Date(value + 'T00:00:00Z');
        return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
      }

      async function fetchDataset(path) {
        const response = await fetch(path, { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error('Could not load ' + path + ' (' + response.status + ').');
        }
        return parseCatalog(await response.text());
      }

      async function fetchCatalogInfo() {
        const response = await fetch('data/catalog-info.json', { cache: 'no-cache' });
        if (!response.ok) {
          throw new Error('Could not load data/catalog-info.json (' + response.status + ').');
        }
        const info = await response.json();
        const baseUrl = new URL(info.xboxStoreBaseUrl);
        const checkedAt = new Date(info.lastCheckedAt);
        if (
          baseUrl.protocol !== 'https:' ||
          baseUrl.hostname !== 'www.xbox.com' ||
          !baseUrl.pathname.endsWith('/games/store/') ||
          !Number.isInteger(info.newGameDisplayDays) ||
          info.newGameDisplayDays <= 0 ||
          Number.isNaN(checkedAt.getTime()) ||
          typeof info.changesFound !== 'boolean'
        ) {
          throw new Error('catalog-info.json is invalid.');
        }
        return info;
      }

      function showLastChecked(value) {
        if (!value) {
          generatedDate.hidden = true;
          generatedDate.textContent = '';
          return;
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          generatedDate.hidden = true;
          generatedDate.textContent = '';
          return;
        }

        generatedDate.textContent = 'Last catalog check ' + date.toLocaleString('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });
        generatedDate.hidden = false;
      }

      async function loadCatalogs() {
        setStatus('loading');
        renderMessage('loading');
        showLastChecked(null);
        try {
          const entries = Object.entries(DATASETS);
          const results = await Promise.all([
            ...entries.map(function (entry) { return fetchDataset(entry[1]); }),
            fetchCatalogInfo()
          ]);
          entries.forEach(function (entry, index) {
            state.datasets[entry[0]] = results[index];
          });
          state.catalogInfo = results.at(-1);
          showLastChecked(state.catalogInfo.lastCheckedAt);
          state.loaded = true;
          setStatus('ready');
          render();
        } catch (error) {
          state.loaded = false;
          setStatus('error');
          renderMessage('error', error instanceof Error ? error.message : String(error));
          console.error(error);
        }
      }

      function setStatus(type) {
        status.classList.remove('ready', 'error');
        if (type === 'ready') {
          status.classList.add('ready');
          statusText.textContent = 'CATALOG READY';
        } else if (type === 'error') {
          status.classList.add('error');
          statusText.textContent = 'CATALOG UNAVAILABLE';
        } else {
          statusText.textContent = 'LOADING CATALOG';
        }
      }

      function renderMessage(type, detail) {
        content.replaceChildren();
        const wrapper = document.createElement('div');
        wrapper.className = 'message' + (type === 'error' ? ' error' : '');
        const inner = document.createElement('div');

        if (type === 'loading') {
          const spinner = document.createElement('div');
          spinner.className = 'spinner';
          spinner.setAttribute('aria-hidden', 'true');
          inner.append(spinner);
        }

        const title = document.createElement('strong');
        title.textContent = type === 'error' ? 'The catalog could not be loaded.' : 'Loading the catalog…';
        inner.append(title);
        inner.append(document.createTextNode(
          type === 'error' ? (detail || 'Please try again.') : 'Reading the processed Game Pass data.'
        ));

        if (type === 'error') {
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'retry-button';
          retry.textContent = 'Try again';
          retry.addEventListener('click', loadCatalogs);
          inner.append(document.createElement('br'), retry);
        }

        wrapper.append(inner);
        content.append(wrapper);
        resultCount.textContent = '0';
      }

      function currentDataset() {
        return state.datasets[state.dataset];
      }

      function categoryCounts(items) {
        const counts = { all: items.length };
        CATEGORY_ORDER.forEach(function (category) {
          counts[category] = 0;
        });
        items.forEach(function (game) {
          if (game.category) counts[game.category] += 1;
        });
        return counts;
      }

      function filteredGames() {
        return currentDataset().filter(function (game) {
          const searchMatch = game.name.toLocaleLowerCase('en-US').includes(state.search);
          const categoryMatch = state.category === 'all' || game.category === state.category;
          const platformMatch = state.platform === 'all' || game[state.platform];
          return searchMatch && categoryMatch && platformMatch;
        });
      }

      function initials(name) {
        const words = name
          .replace(/[™®©:()\[\]]/g, ' ')
          .split(/\s+/)
          .filter(Boolean);
        if (words.length === 0) return 'GP';
        if (words.length === 1) return words[0].slice(0, 3).toUpperCase();
        return (words[0][0] + words[1][0] + (words[2] ? words[2][0] : '')).toUpperCase();
      }

      function artIndex(name) {
        let hash = 0;
        for (let index = 0; index < name.length; index += 1) {
          hash = ((hash << 5) - hash + name.charCodeAt(index)) | 0;
        }
        return Math.abs(hash) % 10;
      }

      function createArt(game, storeUrl) {
        const art = document.createElement('a');
        art.className = 'game-art art-' + artIndex(game.name);
        art.textContent = initials(game.name);
        art.href = storeUrl;
        art.target = '_blank';
        art.rel = 'noopener noreferrer';
        art.title = game.name;
        art.setAttribute('aria-label', 'Open ' + game.name + ' in the Xbox Store');
        return art;
      }

      function isNewGame(game) {
        if (!game.newSinceDate || !state.catalogInfo) return false;
        const now = new Date();
        const todayUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
        const firstSeenUtc = Date.parse(game.newSinceDate + 'T00:00:00Z');
        const ageInDays = Math.floor((todayUtc - firstSeenUtc) / 86400000);
        return ageInDays >= 0 && ageInDays < state.catalogInfo.newGameDisplayDays;
      }

      function createNewGameBadge() {
        const badge = document.createElement('span');
        badge.className = 'new-game-badge';
        badge.textContent = 'New game';
        return badge;
      }

      function createGameIdentity(game) {
        const wrapper = document.createElement('div');
        wrapper.className = 'game';
        const storeUrl = new URL(game.storePath, state.catalogInfo.xboxStoreBaseUrl).toString();
        wrapper.append(createArt(game, storeUrl));

        const copy = document.createElement('div');
        copy.className = 'game-copy';
        const titleRow = document.createElement('div');
        titleRow.className = 'game-title-row';
        const name = document.createElement('a');
        name.className = 'game-name';
        name.textContent = game.name;
        name.title = game.name;
        name.href = storeUrl;
        name.target = '_blank';
        name.rel = 'noopener noreferrer';
        titleRow.append(name);
        if (isNewGame(game)) titleRow.append(createNewGameBadge());
        const note = document.createElement('div');
        note.className = 'game-note';
        note.textContent = DATASET_LABELS[state.dataset];
        const meta = document.createElement('div');
        meta.className = 'game-meta';
        meta.append(note);
        if (game.category) {
          const category = createBadge(game.category);
          category.classList.add('mobile-category');
          category.textContent = CATEGORY_CONFIG[game.category].shortLabel;
          category.setAttribute('aria-label', game.category);
          meta.append(category);
        }
        copy.append(titleRow, meta);
        wrapper.append(copy);
        return wrapper;
      }

      function createBadge(category) {
        const config = CATEGORY_CONFIG[category];
        const badge = document.createElement('span');
        badge.className = 'badge ' + config.badgeClass;
        badge.textContent = config.shortLabel;
        return badge;
      }

      function createAvailability(available, platform) {
        const element = document.createElement('span');
        element.className = available ? 'check' : 'dash';
        element.textContent = available ? '✓' : '—';
        element.setAttribute('aria-label', available ? 'Available on ' + platform : 'Not available on ' + platform);
        return element;
      }

      function renderList(items) {
        const showClassification = items.some(function (game) { return Boolean(game.category); });
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        const headers = [
          { label: '#', className: 'col-rank' },
          { label: 'Game', className: 'col-game' }
        ];
        if (showClassification) {
          headers.push({ label: 'Classification', className: 'col-classification' });
        }
        headers.push(
          { label: 'PC', className: 'col-platform col-pc' },
          { label: 'Console', className: 'col-platform col-console' }
        );
        headers.forEach(function (header) {
          const th = document.createElement('th');
          th.scope = 'col';
          th.className = header.className;
          if (header.label === 'Game') {
            const heading = document.createElement('span');
            heading.className = 'game-heading';
            const headingLabel = document.createElement('span');
            headingLabel.textContent = header.label;
            const mobileDate = document.createElement('span');
            mobileDate.className = 'mobile-generated-date';
            mobileDate.textContent = generatedDate.textContent;
            mobileDate.hidden = generatedDate.hidden;
            heading.append(headingLabel, mobileDate);
            th.append(heading);
          } else {
            th.textContent = header.label;
          }
          headerRow.append(th);
        });
        thead.append(headerRow);

        const tbody = document.createElement('tbody');
        items.forEach(function (game, index) {
          const row = document.createElement('tr');
          const rank = document.createElement('td');
          rank.className = 'rank-cell col-rank';
          rank.textContent = String(index + 1);
          const identity = document.createElement('td');
          identity.className = 'col-game';
          identity.append(createGameIdentity(game));
          const classification = document.createElement('td');
          classification.className = 'col-classification';
          if (game.category) classification.append(createBadge(game.category));
          const pc = document.createElement('td');
          pc.className = 'center col-platform col-pc';
          pc.append(createAvailability(game.pc, 'PC'));
          const consoleCell = document.createElement('td');
          consoleCell.className = 'center col-platform col-console';
          consoleCell.append(createAvailability(game.console, 'Console'));
          row.append(rank, identity);
          if (showClassification) row.append(classification);
          row.append(pc, consoleCell);
          tbody.append(row);
        });

        table.append(thead, tbody);
        wrap.append(table);
        content.replaceChildren(wrap);
      }

      function renderGrid(items) {
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        items.forEach(function (game) {
          const card = document.createElement('article');
          card.className = 'game-card';
          card.append(createGameIdentity(game));
          const details = document.createElement('div');
          details.className = 'card-details';
          if (game.category) details.append(createBadge(game.category));
          const platforms = document.createElement('span');
          platforms.className = 'platforms';
          const labels = [];
          if (game.pc) labels.push('PC');
          if (game.console) labels.push('Console');
          platforms.textContent = labels.join(' · ');
          details.append(platforms);
          card.append(details);
          grid.append(card);
        });
        content.replaceChildren(grid);
      }

      function createCategoryTab(category, label, count) {
        const tab = document.createElement('button');
        const active = state.category === category;
        tab.className = 'tab' + (active ? ' active' : '');
        tab.dataset.category = category;
        tab.type = 'button';
        tab.role = 'tab';
        tab.setAttribute('aria-selected', String(active));
        tab.append(document.createTextNode(label + ' '));
        const value = document.createElement('span');
        value.className = 'tab-count';
        value.textContent = String(count);
        tab.append(value);
        tab.addEventListener('click', function () {
          state.category = category;
          render();
        });
        return tab;
      }

      function updateCategoryControls() {
        const dataset = currentDataset();
        const counts = categoryCounts(dataset);
        const categories = CATEGORY_ORDER.filter(function (category) {
          return counts[category] > 0;
        });
        const hasCategories = categories.length > 0;
        quickTabs.hidden = !hasCategories;
        legend.hidden = !hasCategories;
        quickTabs.replaceChildren();
        legend.replaceChildren();
        if (!hasCategories) return;

        quickTabs.append(createCategoryTab('all', 'All', counts.all));
        categories.forEach(function (category) {
          const config = CATEGORY_CONFIG[category];
          quickTabs.append(createCategoryTab(category, config.shortLabel, counts[category]));
          const item = document.createElement('span');
          const marker = document.createElement('i');
          marker.style.background = config.color;
          item.append(marker, document.createTextNode(config.shortLabel));
          legend.append(item);
        });
      }

      function render() {
        if (!state.loaded) return;
        updateCategoryControls();
        const items = filteredGames();
        resultCount.textContent = String(items.length);
        if (items.length === 0) {
          dataPanel.dataset.view = 'empty';
          content.replaceChildren();
          const empty = document.createElement('div');
          empty.className = 'message';
          const inner = document.createElement('div');
          const title = document.createElement('strong');
          title.textContent = 'No games found.';
          inner.append(title, document.createTextNode('Try changing the search or filters.'));
          empty.append(inner);
          content.append(empty);
          return;
        }
        if (state.view === 'list') {
          dataPanel.dataset.view = 'list';
          renderList(items);
        } else {
          dataPanel.dataset.view = 'grid';
          renderGrid(items);
        }
      }

      document.querySelector('#searchInput').addEventListener('input', function (event) {
        state.search = event.target.value.trim().toLocaleLowerCase('en-US');
        render();
      });

      document.querySelector('#platformFilter').addEventListener('change', function (event) {
        state.platform = event.target.value;
        render();
      });

      document.querySelector('#resultSet').addEventListener('change', function (event) {
        state.dataset = event.target.value;
        state.category = 'all';
        render();
      });

      document.querySelectorAll('[data-view]').forEach(function (button) {
        button.addEventListener('click', function () {
          state.view = button.dataset.view;
          document.querySelectorAll('[data-view]').forEach(function (item) {
            const active = item === button;
            item.classList.toggle('active', active);
            item.setAttribute('aria-pressed', String(active));
          });
          render();
        });
      });

      const themeToggle = document.querySelector('#themeToggle');

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
        themeToggle.setAttribute(
          'aria-label',
          theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        );
      }

      themeToggle.addEventListener('click', function () {
        const nextTheme =
          document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', nextTheme);
        applyTheme(nextTheme);
      });

      applyTheme(document.documentElement.dataset.theme || 'dark');
      loadCatalogs();
    </script>
  </body>
</html>
